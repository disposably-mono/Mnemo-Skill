[project]
name = "mnemo"
version = "0.0.1"
description = "Source-grounded knowledge planning and high-quality Anki authoring via AnkiConnect."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mikel Taopa" }]
keywords = ["anki", "flashcards", "spaced-repetition", "claude", "ankiconnect"]

dependencies = [
    "requests>=2.31",
    "genanki>=0.13",
    "pymupdf>=1.24",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
mnemo-ingest = "mnemo.cli.ingest:main"
mnemo-generate = "mnemo.cli.generate:main"
mnemo-audit = "mnemo.cli.audit:main"
mnemo-import = "mnemo.cli.import_cards:main"
mnemo-export-note-types = "mnemo.cli.export_note_types:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mnemo.resources.fonts" = ["*.txt", "*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mnemo"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
