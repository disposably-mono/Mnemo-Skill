[project]
name = "mnemo"
version = "0.0.1"
description = "Source-grounded, recall-first Anki card authoring via AnkiConnect."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mikel Taopa" }]
keywords = ["anki", "flashcards", "spaced-repetition", "claude", "ankiconnect"]

dependencies = [
    "requests>=2.31",
    "genanki>=0.13",
    "pymupdf>=1.24",
    "python-pptx>=0.6.23",
    "mammoth>=1.7",
    "trafilatura>=1.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mnemo.resources.fonts" = ["*.txt", "*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mnemo"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
